name: Stage 2 Batch D

on:
  pull_request:
    branches: ['stage2/batch-c']
    paths:
      - 'desktop/**'
      - 'src/core/stage2-bridge*'
      - 'entrypoints/background.ts'
      - 'entrypoints/offscreen/**'
      - 'wxt.config.ts'
      - '.github/workflows/stage2-batch-d.yml'

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate extension
        run: |
          npm install
          npm run check
          npm run build
          npm run verify:release
      - name: Validate Windows solution
        run: |
          dotnet restore desktop/Translator.Stage2.slnx --configfile NuGet.Config
          dotnet build desktop/Translator.Stage2.slnx --no-restore --configuration Release
          dotnet run --project desktop/Translator.TechnicalValidation --no-build --configuration Release
      - name: Publish self-contained batch
        run: |
          dotnet publish desktop/Translator.Desktop --configuration Release --runtime win-x64 --self-contained true --output staging/desktop --configfile NuGet.Config
          dotnet publish desktop/Translator.BridgeHost --configuration Release --runtime win-x64 --self-contained true --output staging/bridge-host --configfile NuGet.Config
          dotnet publish desktop/Translator.TechnicalValidation --configuration Release --runtime win-x64 --self-contained true --output staging/validation --configfile NuGet.Config
          Copy-Item desktop/bridge staging/bridge -Recurse
          Copy-Item docs/stage-2/BATCH_D_TEST_GUIDE_ZH.md staging/
          Copy-Item docs/stage-2/STAGE2_DESIGN_ZH.md staging/
          Copy-Item THIRD_PARTY_NOTICES.md staging/
          Copy-Item .output/chrome-mv3 staging/extension -Recurse
      - name: Validate Chrome bridge registration
        shell: pwsh
        run: |
          & staging/bridge/install-bridge.ps1
          $key = Get-Item 'HKCU:\Software\Google\Chrome\NativeMessagingHosts\com.wq5881898.translator.stage2'
          $manifestPath = $key.GetValue('')
          if (-not $manifestPath) {
            throw 'Chrome native host default registry value is missing.'
          }
          $manifest = Get-Content -Raw -LiteralPath $manifestPath | ConvertFrom-Json
          if ($manifest.path -ne (Resolve-Path staging/bridge-host/Translator.BridgeHost.exe).Path) {
            throw 'Chrome native host executable path is incorrect.'
          }
      - uses: actions/upload-artifact@v4
        with:
          name: translator-stage2-batch-d
          path: staging
          if-no-files-found: error
