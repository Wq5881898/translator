name: Stage 2 Batch E

on:
  pull_request:
    branches: ['stage2/batch-d']
    paths:
      - 'desktop/**'
      - 'src/core/**'
      - 'entrypoints/**'
      - 'installer/**'
      - 'docs/stage-2/**'
      - 'wxt.config.ts'
      - '.github/workflows/stage2-batch-e.yml'

concurrency:
  group: stage2-batch-e-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate extension
        run: |
          npm install
          npm run check
          npm run build
          npm run verify:release
      - name: Validate Windows solution
        run: |
          dotnet restore desktop/Translator.Stage2.slnx --configfile NuGet.Config
          dotnet build desktop/Translator.Stage2.slnx --no-restore --configuration Release
          dotnet run --project desktop/Translator.TechnicalValidation --no-build --configuration Release
      - name: Publish self-contained batch
        run: |
          dotnet publish desktop/Translator.Desktop --configuration Release --runtime win-x64 --self-contained true --output staging/desktop --configfile NuGet.Config
          dotnet publish desktop/Translator.BridgeHost --configuration Release --runtime win-x64 --self-contained true --output staging/bridge-host --configfile NuGet.Config
          dotnet publish desktop/Translator.TechnicalValidation --configuration Release --runtime win-x64 --self-contained true --output staging/validation --configfile NuGet.Config
          Copy-Item desktop/bridge staging/bridge -Recurse
          Copy-Item docs/stage-2/BATCH_E_TEST_GUIDE_ZH.md staging/
          Copy-Item docs/stage-2/STAGE2_DESIGN_ZH.md staging/
          Copy-Item THIRD_PARTY_NOTICES.md staging/
          Copy-Item .output/chrome-mv3 staging/extension -Recurse
      - name: Build and validate single-file installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { throw 'Inno Setup 6 is not available on the Windows runner.' }
          & $iscc installer/Translator.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed with exit code $LASTEXITCODE." }
          $setup = Resolve-Path installer-output/Translator-Setup-v1.1.8.exe
          $process = Start-Process -FilePath $setup -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/SP-' -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Silent installation failed with exit code $($process.ExitCode)." }
          $installRoot = Join-Path $env:LOCALAPPDATA 'Programs\Translator'
          if (-not (Test-Path (Join-Path $installRoot 'desktop\Translator.Desktop.exe'))) { throw 'Installed desktop executable is missing.' }
          if (-not (Test-Path (Join-Path $installRoot 'extension\manifest.json'))) { throw 'Installed extension is missing.' }
          $key = Get-Item 'HKCU:\Software\Google\Chrome\NativeMessagingHosts\com.wq5881898.translator.stage2'
          $manifestPath = $key.GetValue('')
          if (-not $manifestPath -or -not (Test-Path $manifestPath)) { throw 'Installer did not register the Chrome bridge.' }
          $manifest = Get-Content -Raw -Encoding UTF8 $manifestPath | ConvertFrom-Json
          if (-not (Test-Path $manifest.path)) { throw 'Registered Bridge Host path is invalid.' }
          $bridgeStart = [System.Diagnostics.ProcessStartInfo]::new()
          $bridgeStart.FileName = $manifest.path
          $bridgeStart.UseShellExecute = $false
          $bridgeStart.RedirectStandardInput = $true
          $bridgeStart.CreateNoWindow = $true
          $lockedBridge = [System.Diagnostics.Process]::new()
          $lockedBridge.StartInfo = $bridgeStart
          if (-not $lockedBridge.Start()) { throw 'Could not start the upgrade lock simulation.' }
          Start-Sleep -Seconds 1
          if ($lockedBridge.HasExited) { throw 'Bridge Host exited before the upgrade test.' }
          $upgrade = Start-Process -FilePath $setup -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/SP-' -Wait -PassThru
          if ($upgrade.ExitCode -ne 0) { throw "In-place upgrade failed with exit code $($upgrade.ExitCode)." }
          $lockedBridge.Refresh()
          if (-not $lockedBridge.HasExited) { throw 'The installer did not stop the running Bridge Host.' }
          $upgradeKey = Get-Item 'HKCU:\Software\Google\Chrome\NativeMessagingHosts\com.wq5881898.translator.stage2'
          $upgradeManifestPath = $upgradeKey.GetValue('')
          if (-not $upgradeManifestPath -or -not (Test-Path $upgradeManifestPath)) { throw 'In-place upgrade did not restore the Chrome bridge registration.' }
          Start-Sleep -Seconds 5
          foreach ($view in @([Microsoft.Win32.RegistryView]::Registry64, [Microsoft.Win32.RegistryView]::Registry32)) {
            $base = [Microsoft.Win32.RegistryKey]::OpenBaseKey([Microsoft.Win32.RegistryHive]::CurrentUser, $view)
            $nativeKey = $base.OpenSubKey('Software\Google\Chrome\NativeMessagingHosts\com.wq5881898.translator.stage2')
            $delayedManifestPath = if ($nativeKey) { $nativeKey.GetValue('') } else { $null }
            if (-not $delayedManifestPath -or -not (Test-Path $delayedManifestPath)) {
              throw "Chrome bridge registration did not persist in $view after upgrade cleanup."
            }
          }
          $uninstaller = Join-Path $installRoot 'unins000.exe'
          $uninstall = Start-Process -FilePath $uninstaller -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART' -Wait -PassThru
          if ($uninstall.ExitCode -ne 0) { throw "Silent uninstall failed with exit code $($uninstall.ExitCode)." }
      - name: Validate Chrome bridge registration
        shell: pwsh
        run: |
          & staging/bridge/install-bridge.ps1
          $key = Get-Item 'HKCU:\Software\Google\Chrome\NativeMessagingHosts\com.wq5881898.translator.stage2'
          $manifestPath = $key.GetValue('')
          if (-not $manifestPath) { throw 'Chrome native host registry value is missing.' }
      - uses: actions/upload-artifact@v4
        with:
          name: translator-stage2-batch-e
          path: staging
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: translator-stage2-installer
          path: installer-output/Translator-Setup-v1.1.8.exe
          if-no-files-found: error
